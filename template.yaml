AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  OmniTrace: Autonomous Cloud Incident Triage & Self-Healing Pipeline
  Deploys the complete serverless backend for the OmniTrace platform.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 120
    MemorySize: 512
    Environment:
      Variables:
        INCIDENT_TABLE: OmniTrace_Incidents
        DYNAMODB_TABLE: OmniTrace_Incidents
        STATE_MACHINE_ARN: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:OmniTrace-Pipeline-${Environment}
        POWERTOOLS_SERVICE_NAME: OmniTrace
        LOG_LEVEL: INFO

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

Resources:

  # ─────────────────────────────────────────────────────────────────────────
  # SNS Topic — SRE Escalation (VETO path)
  # ─────────────────────────────────────────────────────────────────────────
  OmniTraceSREEscalationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub OmniTrace-SRE-Escalation-${Environment}
      DisplayName: OmniTrace SRE Escalation
      Tags:
        - Key: Project
          Value: OmniTrace
        - Key: Environment
          Value: !Ref Environment

  # ─────────────────────────────────────────────────────────────────────────
  # NOTE: DynamoDB Table is managed outside CloudFormation (DeletionPolicy: Retain
  # was set at creation). The table OmniTrace_Incidents already exists in
  # us-east-1 with incidentId (PK) and timestamp (SK). Managing it here
  # caused GSI update conflicts. The table ARN is referenced directly in
  # IAM policies using !Sub with the known table name.
  # ─────────────────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────────────────
  # IAM Role — AgentDispatcher + SelfHealer (explicit Bedrock permissions)
  # ─────────────────────────────────────────────────────────────────────────
  OmniTraceAgentDispatcherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub OmniTrace-AgentDispatcher-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OmniTraceAgentDispatcherPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BedrockInvokeModel
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-pro-v1:0
                  - arn:aws:bedrock:us-east-1:755329540298:inference-profile/us.amazon.nova-pro-v1:0
              - Sid: BedrockConverse
                Effect: Allow
                Action:
                  - bedrock:Converse
                Resource:
                  - arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-pro-v1:0
                  - arn:aws:bedrock:us-east-1:755329540298:inference-profile/us.amazon.nova-pro-v1:0
              - Sid: DynamoDBFullAccess
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - arn:aws:dynamodb:us-east-1:755329540298:table/OmniTrace_Incidents
                  - arn:aws:dynamodb:us-east-1:755329540298:table/OmniTrace_Incidents/index/*
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  OmniTraceSelfHealerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub OmniTrace-SelfHealer-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OmniTraceSelfHealerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BedrockInvokeModel
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-pro-v1:0
                  - arn:aws:bedrock:us-east-1:755329540298:inference-profile/us.amazon.nova-pro-v1:0
              - Sid: BedrockConverse
                Effect: Allow
                Action:
                  - bedrock:Converse
                Resource:
                  - arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-pro-v1:0
                  - arn:aws:bedrock:us-east-1:755329540298:inference-profile/us.amazon.nova-pro-v1:0
              - Sid: DynamoDBFullAccess
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - arn:aws:dynamodb:us-east-1:755329540298:table/OmniTrace_Incidents
                  - arn:aws:dynamodb:us-east-1:755329540298:table/OmniTrace_Incidents/index/*
              - Sid: SNSEscalation
                Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref OmniTraceSREEscalationTopic
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  # ─────────────────────────────────────────────────────────────────────────
  # IAM Role — ApiHandler
  # ─────────────────────────────────────────────────────────────────────────
  OmniTraceApiHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub OmniTrace-ApiHandler-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OmniTraceApiHandlerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DynamoDBReadWrite
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - arn:aws:dynamodb:us-east-1:755329540298:table/OmniTrace_Incidents
                  - arn:aws:dynamodb:us-east-1:755329540298:table/OmniTrace_Incidents/index/*
              - Sid: EventBridgePutEvents
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default
              - Sid: StepFunctionsRead
                Effect: Allow
                Action:
                  - states:DescribeExecution
                  - states:ListExecutions
                Resource:
                  - !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:OmniTrace-Pipeline-${Environment}
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  # ─────────────────────────────────────────────────────────────────────────
  # IAM Role — Step Functions State Machine
  # ─────────────────────────────────────────────────────────────────────────
  OmniTraceStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub OmniTrace-StateMachine-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: OmniTraceStateMachinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeLambdaFunctions
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:OmniTrace-AgentDispatcher-${Environment}
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:OmniTrace-SelfHealer-${Environment}
              - Sid: CloudWatchLogsDelivery
                Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutLogEvents
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'
              - Sid: XRayTracing
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: '*'

  # ─────────────────────────────────────────────────────────────────────────
  # IAM Role — EventBridge → Step Functions
  # ─────────────────────────────────────────────────────────────────────────
  OmniTraceEventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub OmniTrace-EventBridge-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: OmniTraceEventBridgePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  - !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:OmniTrace-Pipeline-${Environment}

  # ─────────────────────────────────────────────────────────────────────────
  # Lambda Functions
  # ─────────────────────────────────────────────────────────────────────────
  OmniTraceAgentDispatcher:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub OmniTrace-AgentDispatcher-${Environment}
      CodeUri: backend/handlers/
      Handler: agent_dispatcher.handler
      Role: !GetAtt OmniTraceAgentDispatcherRole.Arn
      Timeout: 300
      MemorySize: 1024
      Description: Orchestrates Bedrock Converse API calls for AUDITOR, PATCHER, and VALIDATOR agents
      Environment:
        Variables:
          BEDROCK_MODEL_ID: us.amazon.nova-pro-v1:0
          BEDROCK_REGION: us-east-1
          AGENT_MODE: SIMULATE
          INCIDENT_TABLE: OmniTrace_Incidents
          DYNAMODB_TABLE: OmniTrace_Incidents
      Tags:
        Project: OmniTrace
        Function: AgentDispatcher

  OmniTraceSelfHealer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub OmniTrace-SelfHealer-${Environment}
      CodeUri: backend/handlers/
      Handler: self_healer.handler
      Role: !GetAtt OmniTraceSelfHealerRole.Arn
      Timeout: 120
      MemorySize: 512
      Description: Executes safe remediation actions and updates incident status to RESOLVED
      Environment:
        Variables:
          INCIDENT_TABLE: OmniTrace_Incidents
          DYNAMODB_TABLE: OmniTrace_Incidents
          SNS_ESCALATION_TOPIC: !Ref OmniTraceSREEscalationTopic
      Tags:
        Project: OmniTrace
        Function: SelfHealer

  OmniTraceApiHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub OmniTrace-ApiHandler-${Environment}
      CodeUri: backend/handlers/
      Handler: api_handler.handler
      Role: !GetAtt OmniTraceApiHandlerRole.Arn
      Timeout: 30
      MemorySize: 256
      Description: REST API handler serving the React frontend
      Environment:
        Variables:
          INCIDENT_TABLE: OmniTrace_Incidents
          DYNAMODB_TABLE: OmniTrace_Incidents
          STATE_MACHINE_ARN: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:OmniTrace-Pipeline-${Environment}
          EVENTBRIDGE_BUS: default
      Events:
        GetIncidents:
          Type: HttpApi
          Properties:
            ApiId: !Ref OmniTraceHttpApi
            Path: /api/incidents
            Method: GET
        TriggerSimulation:
          Type: HttpApi
          Properties:
            ApiId: !Ref OmniTraceHttpApi
            Path: /api/trigger
            Method: POST
        GetIncidentById:
          Type: HttpApi
          Properties:
            ApiId: !Ref OmniTraceHttpApi
            Path: /api/incidents/{incidentId}
            Method: GET
        OptionsIncidents:
          Type: HttpApi
          Properties:
            ApiId: !Ref OmniTraceHttpApi
            Path: /api/incidents
            Method: OPTIONS
        OptionsTrigger:
          Type: HttpApi
          Properties:
            ApiId: !Ref OmniTraceHttpApi
            Path: /api/trigger
            Method: OPTIONS
        OptionsIncidentById:
          Type: HttpApi
          Properties:
            ApiId: !Ref OmniTraceHttpApi
            Path: /api/incidents/{incidentId}
            Method: OPTIONS
      Tags:
        Project: OmniTrace
        Function: ApiHandler

  # ─────────────────────────────────────────────────────────────────────────
  # API Gateway HTTP API v2
  # ─────────────────────────────────────────────────────────────────────────
  OmniTraceHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
          - X-Amz-Date
          - X-Api-Key
        AllowMethods:
          - GET
          - POST
          - OPTIONS
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100
      Tags:
        Project: OmniTrace

  # ─────────────────────────────────────────────────────────────────────────
  # CloudWatch Log Groups
  # ─────────────────────────────────────────────────────────────────────────
  AgentDispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/OmniTrace-AgentDispatcher-${Environment}
      RetentionInDays: 90

  SelfHealerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/OmniTrace-SelfHealer-${Environment}
      RetentionInDays: 90

  ApiHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/OmniTrace-ApiHandler-${Environment}
      RetentionInDays: 90

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/states/OmniTrace-Pipeline-${Environment}
      RetentionInDays: 90

  # ─────────────────────────────────────────────────────────────────────────
  # Step Functions State Machine
  # ─────────────────────────────────────────────────────────────────────────
  OmniTraceStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub OmniTrace-Pipeline-${Environment}
      Role: !GetAtt OmniTraceStateMachineRole.Arn
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
        IncludeExecutionData: true
        Level: ALL
      Tracing:
        Enabled: true
      Definition:
        Comment: OmniTrace Autonomous Incident Triage and Self-Healing Pipeline
        StartAt: AuditorDiagnosis
        States:
          AuditorDiagnosis:
            Type: Task
            Resource: !GetAtt OmniTraceAgentDispatcher.Arn
            Parameters:
              agent_role: AUDITOR
              incident.$: $
            ResultPath: $.auditor_result
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                  - States.TaskFailed
                IntervalSeconds: 5
                MaxAttempts: 3
                BackoffRate: 2
            Catch:
              - ErrorEquals:
                  - States.ALL
                Next: IncidentFailed
                ResultPath: $.error
            Next: PatcherDrafting
          PatcherDrafting:
            Type: Task
            Resource: !GetAtt OmniTraceAgentDispatcher.Arn
            Parameters:
              agent_role: PATCHER
              incident.$: $
            ResultPath: $.patcher_result
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.TooManyRequestsException
                  - States.TaskFailed
                IntervalSeconds: 5
                MaxAttempts: 3
                BackoffRate: 2
            Catch:
              - ErrorEquals:
                  - States.ALL
                Next: IncidentFailed
                ResultPath: $.error
            Next: ValidatorCheck
          ValidatorCheck:
            Type: Task
            Resource: !GetAtt OmniTraceAgentDispatcher.Arn
            Parameters:
              agent_role: VALIDATOR
              incident.$: $
            ResultPath: $.validator_result
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.TooManyRequestsException
                  - States.TaskFailed
                IntervalSeconds: 5
                MaxAttempts: 3
                BackoffRate: 2
            Catch:
              - ErrorEquals:
                  - States.ALL
                Next: IncidentFailed
                ResultPath: $.error
            Next: SafetyDecision
          SafetyDecision:
            Type: Choice
            Choices:
              - Variable: $.validator_result.verdict
                StringEquals: VETO
                Next: EscalateToSRE
              - Variable: $.validator_result.verdict
                StringEquals: EXECUTE
                Next: ExecuteRemediation
            Default: EscalateToSRE
          ExecuteRemediation:
            Type: Task
            Resource: !GetAtt OmniTraceSelfHealer.Arn
            Parameters:
              incident.$: $
            ResultPath: $.healer_result
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.TooManyRequestsException
                  - States.TaskFailed
                IntervalSeconds: 3
                MaxAttempts: 2
                BackoffRate: 1.5
            Catch:
              - ErrorEquals:
                  - States.ALL
                Next: IncidentFailed
                ResultPath: $.error
            Next: IncidentResolved
          IncidentResolved:
            Type: Succeed
          EscalateToSRE:
            Type: Pass
            Parameters:
              incidentId.$: $.incidentId
              status: ESCALATED
              reason: Validator vetoed automated remediation - human intervention required
              validator_findings.$: $.validator_result
            ResultPath: $.escalation
            Next: IncidentEscalated
          IncidentEscalated:
            Type: Succeed
          IncidentFailed:
            Type: Fail
            Error: OmniTracePipelineError
            Cause: One or more pipeline stages failed

  # ─────────────────────────────────────────────────────────────────────────
  # EventBridge Rule — listens for omnitrace.alert source
  # ─────────────────────────────────────────────────────────────────────────
  OmniTraceEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub OmniTrace-IncidentAlert-${Environment}
      Description: Listens for OmniTrace incident alerts and triggers the triage pipeline
      EventBusName: default
      EventPattern:
        source:
          - omnitrace.alert
        detail-type:
          - OmniTraceIncident
      State: ENABLED
      Targets:
        - Id: OmniTraceStateMachineTarget
          Arn: !Ref OmniTraceStateMachine
          RoleArn: !GetAtt OmniTraceEventBridgeRole.Arn
          InputTransformer:
            InputPathsMap:
              incidentId: $.detail.incidentId
              service: $.detail.service
              errorType: $.detail.errorType
              severity: $.detail.severity
              region: $.detail.region
              errorLogs: $.detail.errorLogs
              timestamp: $.time
            InputTemplate: |
              {
                "incidentId": "<incidentId>",
                "service": "<service>",
                "errorType": "<errorType>",
                "severity": "<severity>",
                "region": "<region>",
                "errorLogs": "<errorLogs>",
                "timestamp": "<timestamp>"
              }

  # ─────────────────────────────────────────────────────────────────────────
  # CloudWatch Alarms
  # ─────────────────────────────────────────────────────────────────────────
  AgentDispatcherErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub OmniTrace-AgentDispatcher-Errors-${Environment}
      AlarmDescription: Alert when agent dispatcher Lambda has errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Sub OmniTrace-AgentDispatcher-${Environment}
      TreatMissingData: notBreaching

  StateMachineFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub OmniTrace-Pipeline-Failures-${Environment}
      AlarmDescription: Alert when the triage pipeline has execution failures
      MetricName: ExecutionsFailed
      Namespace: AWS/States
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref OmniTraceStateMachine
      TreatMissingData: notBreaching

# ─────────────────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────────────────
Outputs:
  ApiEndpoint:
    Description: OmniTrace REST API endpoint URL
    Value: !Sub https://${OmniTraceHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub OmniTrace-ApiEndpoint-${Environment}

  DynamoDBTableName:
    Description: OmniTrace DynamoDB incidents table name
    Value: OmniTrace_Incidents
    Export:
      Name: !Sub OmniTrace-DynamoDBTable-${Environment}

  StateMachineArn:
    Description: OmniTrace Step Functions state machine ARN
    Value: !Ref OmniTraceStateMachine
    Export:
      Name: !Sub OmniTrace-StateMachineArn-${Environment}

  AgentDispatcherArn:
    Description: Agent Dispatcher Lambda ARN
    Value: !GetAtt OmniTraceAgentDispatcher.Arn

  ApiHandlerArn:
    Description: API Handler Lambda ARN
    Value: !GetAtt OmniTraceApiHandler.Arn

  SREEscalationTopicArn:
    Description: SNS topic ARN for SRE escalation (VETO path)
    Value: !Ref OmniTraceSREEscalationTopic
    Export:
      Name: !Sub OmniTrace-SREEscalationTopic-${Environment}
