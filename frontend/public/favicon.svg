<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d0d2b"/>
      <stop offset="100%" stop-color="#060610"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00cfff"/>
      <stop offset="50%" stop-color="#4466ff"/>
      <stop offset="100%" stop-color="#8833ff"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00cfff"/>
      <stop offset="100%" stop-color="#cc44ff"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55ccff"/>
      <stop offset="50%" stop-color="#8866ff"/>
      <stop offset="100%" stop-color="#dd44ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundedBox">
      <rect width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGlow)"/>

  <!-- Outer neon border glow -->
  <rect width="512" height="512" rx="96" ry="96" fill="none" stroke="#3355ff" stroke-width="6" opacity="0.6" filter="url(#glow)"/>
  <rect width="512" height="512" rx="96" ry="96" fill="none" stroke="#00aaff" stroke-width="2" opacity="0.9"/>

  <!-- Main ring "O" -->
  <ellipse cx="256" cy="210" rx="110" ry="110" fill="none" stroke="url(#ringGrad)" stroke-width="28" filter="url(#glow)"/>
  <ellipse cx="256" cy="210" rx="110" ry="110" fill="none" stroke="url(#ringGrad)" stroke-width="18"/>

  <!-- Orbital arc sweeping through the ring -->
  <ellipse cx="256" cy="218" rx="145" ry="52" fill="none" stroke="url(#orbitGrad)" stroke-width="10" stroke-dasharray="1000" stroke-dashoffset="0" transform="rotate(-28 256 218)" filter="url(#glow)" opacity="0.9"/>
  <ellipse cx="256" cy="218" rx="145" ry="52" fill="none" stroke="url(#orbitGrad)" stroke-width="5" transform="rotate(-28 256 218)" opacity="0.95"/>

  <!-- Orbital dot / node -->
  <circle cx="375" cy="176" r="13" fill="#ffffff" filter="url(#glow)" opacity="0.95"/>
  <circle cx="375" cy="176" r="8" fill="#cc88ff"/>
  <circle cx="375" cy="176" r="4" fill="#ffffff"/>

  <!-- Text "OmniTrace" -->
  <text x="256" y="365"
    font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="72"
    font-weight="700"
    text-anchor="middle"
    fill="url(#textGrad)"
    filter="url(#softGlow)"
    letter-spacing="-2">OmniTrace</text>
</svg>
